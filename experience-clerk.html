  <!-- Capture every mic stream before Clerk/Hume scripts load so Mute can hard-kill tracks. -->
  <script>
    (() => {
      const registry = {
        streams: [],
        tracks: [],
        muted: false,
      };
      window.__CP_MIC_REGISTRY = registry;

      const rememberStream = (stream) => {
        if (!stream || typeof stream.getAudioTracks !== 'function') return stream;
        if (!registry.streams.includes(stream)) registry.streams.push(stream);
        try {
          stream.getAudioTracks().forEach((track) => {
            if (!track) return;
            if (!registry.tracks.includes(track)) registry.tracks.push(track);
            // If currently muted, immediately silence any new track.
            if (registry.muted) {
              try { track.enabled = false; } catch (_e) {}
              try { track.stop(); } catch (_e) {}
            }
            try {
              track.addEventListener('ended', () => {
                registry.tracks = registry.tracks.filter((t) => t !== track);
              });
            } catch (_e) {}
          });
        } catch (_e) {}
        return stream;
      };

      const wrapGetUserMedia = (fn) => {
        if (typeof fn !== 'function') return fn;
        return function patchedGetUserMedia(constraints) {
          const result = fn.call(this, constraints);
          if (result && typeof result.then === 'function') {
            return result.then((stream) => rememberStream(stream));
          }
          return rememberStream(result);
        };
      };

      const installOnNavigator = (nav) => {
        if (!nav) return false;
        try {
          if (nav.mediaDevices && typeof nav.mediaDevices.getUserMedia === 'function') {
            if (!nav.mediaDevices.__cpMicPatched) {
              nav.mediaDevices.getUserMedia = wrapGetUserMedia(nav.mediaDevices.getUserMedia.bind(nav.mediaDevices));
              nav.mediaDevices.__cpMicPatched = true;
            }
          }
        } catch (_e) {}
        try {
          if (typeof nav.getUserMedia === 'function' && !nav.__cpLegacyMicPatched) {
            nav.getUserMedia = wrapGetUserMedia(nav.getUserMedia.bind(nav));
            nav.__cpLegacyMicPatched = true;
          }
        } catch (_e) {}
        try {
          if (typeof nav.webkitGetUserMedia === 'function' && !nav.__cpWebkitMicPatched) {
            nav.webkitGetUserMedia = wrapGetUserMedia(nav.webkitGetUserMedia.bind(nav));
            nav.__cpWebkitMicPatched = true;

        if (typeof window.closeClerkVoiceModal === 'function') {
          try {
            window.closeClerkVoiceModal({
              reason: 'stop-listening-button',
              preserveDailyMeter: true,
              preserveRoaming: false
            });
          } catch (_e) {}
        }

        // Extra cancel after close in case widget was mid-utterance.
        window.setTimeout(() => {
          try { postVoiceMessage('cancel'); } catch (_e) {}
          try { hardMuteMicrophone(); } catch (_e) {}
        }, 120);
        window.setTimeout(() => {
          try { postVoiceMessage('cancel'); } catch (_e) {}
        }, 600);

        setBottomWaiting();
        // Stay stopped. User must click Waiting on Clerk to start a fresh session.
        return true;
      };

      const launchClerkVoice = async ({ toggleOnly = false } = {}) => {
        if (launchInProgress) return false;
        launchInProgress = true;
        applyClerkConfig();
        let ok = false;
        try {
          const state = String(bottomBtn.getAttribute('data-clerk-state') || '').toLowerCase();
          const label = String(bottomBtn.textContent || '').trim().toLowerCase();
          if (toggleOnly || isLive) {
            if (isLive || state === 'pause-ready' || label === 'pause clerk') {
              await pauseClerkLikeClaire();
              return true;
            }
          }
          bottomBtn.disabled = true;
          bottomBtn.innerHTML = '<span class="cp-clerk-bottom-btn-primary">Connecting...</span><small>Please wait</small>';
          bottomBtn.setAttribute('aria-label', 'Connecting Clerk voice.');
          // Best-effort mic warm-up; never hang launch.
          await requestMicPermissionFromUserGesture();
          ok = await openClerkSession({ autoStart: true });
          if (ok) {
            pausedHard = false;
            startLiveWatch();
            // Safety: if no live audio arrives, unlock Ready again.
            window.setTimeout(() => {
              if (!isLive && !pausedHard) {
                console.warn('[cp-page8] No live audio yet; re-enabling Ready');
                setBottomWaiting();
              }
            }, 12000);
          } else {
            setBottomWaiting();
          }
          return ok;
        } catch (err) {
          console.error('[cp-page8] launchClerkVoice error', err);
          setBottomWaiting();
          return false;
        } finally {
          bottomBtn.disabled = false;
          launchInProgress = false;
          if (!ok && !isLive) setBottomWaiting();
        }
      };

      // 1) Speak with Clerk -> reveal presence only (session starts from Waiting button)
      speakBtn.addEventListener('click', () => {
        if (active) return;
        setActive(true);
        setTalkWaveVisible(true);
        startTalkWaveLoop();
        setBottomWaiting();
        // Kick auth fetch immediately so credentials are warm before modal open.
        void ensureClerkRuntimeAuth();
      });

      // 2) Claire-style control: Pause Clerk <-> Waiting on Clerk
      bottomBtn.addEventListener('click', () => {
        void launchClerkVoice({ toggleOnly: true });
      });

      window.addEventListener('message', (event) => {
        const data = event && event.data;
        if (!data || typeof data !== 'object') return;
        const t = String(data.type || '').toLowerCase();
        if (!t) return;
        const payload = data.payload && typeof data.payload === 'object' ? data.payload : {};
        const role = String(payload.role || payload.speaker || payload.source || '').toLowerCase();

        // When renderer becomes ready, arm start path if we requested auto-start.
        if (
          t === 'widget_iframe_is_ready' ||
          t === 'widget_iframe_ready' ||
          t === 'widget_ready' ||
          t === 'iframe_ready' ||
          t.includes('assistant_ready')
        ) {
          widgetReadySeen = true;
          if (autoStartArmed && !isLive && !pausedHard) {
            const epoch = sessionEpoch;
            const kick = () => {
              if (epoch !== sessionEpoch || !autoStartArmed || isLive || pausedHard) return;
              // 1) host start gate button
              if (clickNativeStartOrPause()) startClickCount += 1;
              // 2) internal renderer Start Conversation button (Claire working path)
              try {
                if (typeof window.clickIframeStartConversationButton === 'function') {
                  window.clickIframeStartConversationButton();
                } else {
                  const frame = getVoiceFrame();
                  const doc = frame && (frame.contentDocument || (frame.contentWindow && frame.contentWindow.document));
                  if (doc) {
                    const buttons = Array.from(doc.querySelectorAll('button, [role="button"]'));
                    const startBtn = buttons.find((b) => /start conversation|start talking|start|connect|begin/i.test(String(b.textContent || '')));
                    if (startBtn && !startBtn.disabled) startBtn.click();
                  }
                }
              } catch (_e) {}
              try { postVoiceMessage('start_listening'); } catch (_e) {}
              startLiveWatch();
            };
            window.setTimeout(kick, 200);
            window.setTimeout(kick, 800);
            window.setTimeout(kick, 1800);
          }
        }

        if (t.includes('connection_open') || t.includes('socket_open') || t.includes('agent_connected')) {
          console.info('[cp-page8] Clerk connection signal:', t);
        }
        if (t === 'socket_error' || t === 'error' || t.includes('socket_error')) {
          const detail = String((payload && (payload.message || payload.detail || payload.reason || payload.error)) || data.message || t);
          console.error('[cp-page8] Clerk socket/channel error:', detail, data);
          // Hume labels generic socket_error as "at capacity" even when cause is auth/config/connect.
          bottomBtn.innerHTML = '<span class="cp-clerk-bottom-btn-primary">Channel blocked</span><small>Retry</small>';
          bottomBtn.setAttribute('data-clerk-state', 'capacity');
          bottomBtn.setAttribute('aria-label', 'Clerk channel blocked. Retry.');
          isLive = false;
        }
        if (t === 'mic_error') {
          console.error('[cp-page8] mic_error', data);
          bottomBtn.innerHTML = '<span class="cp-clerk-bottom-btn-primary">Mic blocked</span><small>Allow mic</small>';
          setBottomWaiting();
        }

        // After hard Pause, ignore late assistant events so he cannot "come back".
        if (pausedHard) {
          if (
            t.includes('audio') ||
            t.includes('assistant') ||
            t.includes('tts') ||
            t.includes('conversation_started') ||
            t.includes('session_started') ||
            t.includes('voice_started')
          ) {
            try { postVoiceMessage('cancel'); } catch (_e) {}
            return;
          }
        }

        // Assistant audio / speech activity => animate waveform above Waiting/Pause button.
        if (
          t === 'audio_start' ||
          t === 'audio_output' ||
          t.includes('tts_start') ||
          t.includes('assistant_speak') ||
          t.includes('assistant_audio') ||
          t.includes('audio_chunk') ||
          t.includes('play_audio') ||
          (t.includes('audio') && role !== 'user' && !t.includes('user'))
        ) {
          if (role !== 'user' && !pausedHard) {
            markClerkLive();
            pulseTalkWaveSpeaking(1200);
          }
          return;
        }

        if (
          t === 'audio_end' ||
          t.includes('tts_end') ||
          t.includes('assistant_end') ||
          t.includes('speech_end') ||
          t.includes('audio_idle')
        ) {
          setTalkWaveSpeaking(false);
          return;
        }

        // Any assistant/output signal => Clerk is live => Pause Clerk
        if (
          t === 'assistant_message' ||
          t === 'transcript_message' ||
          t.includes('conversation_started') ||
          t.includes('session_started') ||
          t.includes('voice_started') ||
          t.includes('agent_connected') ||
          (t.includes('assistant') && role !== 'user')
        ) {
          if (role === 'user' && (t === 'transcript_message' || t.includes('user'))) return;
          markClerkLive();
          if (t === 'assistant_message' || t.includes('assistant')) {
            pulseTalkWaveSpeaking(1600);
          }
          return;
        }

        // Session ended / collapsed => Waiting (Claire soft-reset style)
        if (
          t === 'collapse_widget' ||
          t.includes('session_ended') ||
          t.includes('conversation_ended')
        ) {
          isLive = false;
          setTalkWaveSpeaking(false);
          setBottomWaiting();
        }
      });

      window.addEventListener('clerkVoiceModalClosed', () => {
        launchInProgress = false;
        autoStartArmed = false;
        // Keep presence page active; only reset live/waiting control like Claire.
        // Do not auto-reopen after pause-driven close.
        autoStartArmed = false;
        isLive = false;
        greetingStarted = false;
        setTalkWaveSpeaking(false);
        if (speakHoldTimer) {
          window.clearTimeout(speakHoldTimer);
          speakHoldTimer = 0;
        }
        if (liveWatchTimer) {
          window.clearInterval(liveWatchTimer);
          liveWatchTimer = 0;
        }
        try {
          if (micGateStream) {
            micGateStream.getTracks().forEach((t) => { try { t.stop(); } catch (_e) {} });
            micGateStream = null;
          }
        } catch (_err) {}
        mutedAudioTracks = [];
        // Do NOT leave mic interceptor gated off, or next start cannot capture audio.
        if (typeof window.__CP_SET_MIC_MUTED === 'function') {
          try { window.__CP_SET_MIC_MUTED(false); } catch (_e) {}
        }
        setBottomWaiting();
      });

      // Apply config early so page-access lock cannot block first launch.
      const bootConfig = () => {
        applyClerkConfig();
      };
      bootConfig();
      window.setTimeout(bootConfig, 50);
      window.setTimeout(bootConfig, 250);
      // Warm Claire-parity auth as soon as page is ready.
      window.setTimeout(() => { void ensureClerkRuntimeAuth(); }, 80);

      // When the voice iframe is created/loaded, install mic interceptor inside it.
      const watchVoiceFrame = () => {
        const bindFrame = (frame) => {
          if (!frame || frame.dataset.cpMicBound === '1') return;
          frame.dataset.cpMicBound = '1';
          frame.addEventListener('load', () => {
            installInterceptorOnFrame();
            // Always allow mic acquisition on frame load; Pause handles hard-stop separately.
            if (typeof window.__CP_SET_MIC_MUTED === 'function') {
              window.__CP_SET_MIC_MUTED(false);
            }
          });
          installInterceptorOnFrame();
        };
        const existing = getVoiceFrame();
        if (existing) bindFrame(existing);
        const obs = new MutationObserver(() => {
          const frame = getVoiceFrame();
          if (frame) bindFrame(frame);
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      };
      watchVoiceFrame();

      setActive(false);
      setBottomWaiting();
    })();
  </script>
</body>
</html>
