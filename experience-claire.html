      const setSpeaking = (on) => {
        if (!bubbleEl) return;
        bubbleEl.classList.toggle("is-speaking", Boolean(on));
      };


      const hardStopClaireVoice = () => {
        try { if (typeof window.stopKurandaClaireBubble === "function") window.stopKurandaClaireBubble(); } catch (e) {}
        try { document.body.classList.remove("claire-is-speaking", "claire-host-active", "curl-host-active", "curl-is-speaking"); } catch (e) {}

          if (window.ClerkVoiceWidget) {
            if (typeof window.ClerkVoiceWidget.close === "function") window.ClerkVoiceWidget.close();
            if (typeof window.ClerkVoiceWidget.closeModal === "function") window.ClerkVoiceWidget.closeModal();
            if (typeof window.ClerkVoiceWidget.endSession === "function") window.ClerkVoiceWidget.endSession();
            if (typeof window.ClerkVoiceWidget.pause === "function") window.ClerkVoiceWidget.pause();
          }
        } catch (e) {}
        try {
          const closeBtn = document.getElementById("clerkVoiceCloseBtn");
          if (closeBtn) closeBtn.click();
        } catch (e) {}
        try {
          const modal = document.getElementById("clerkVoiceModal") || document.querySelector(".clerk-voice-modal");
          if (modal) {
            modal.classList.remove("is-open", "active", "show");
            modal.setAttribute("aria-hidden", "true");
            modal.style.display = "none";
          }
        } catch (e) {}
        try {
          document.querySelectorAll("audio, video").forEach(function (el) {
            try { el.pause(); } catch (e2) {}
          });
        } catch (e) {}
      };

      // Always tear down voice when leaving page 2 (Back / Home / refresh)
      window.addEventListener("pagehide", hardStopClaireVoice);
      window.addEventListener("beforeunload", hardStopClaireVoice);

      const waitFor = async (testFn, timeoutMs = 10000) => {
        const start = Date.now();
        while (Date.now() - start < timeoutMs) {
          const value = testFn();
          if (value) return value;
          await new Promise((r) => setTimeout(r, 40));
        }
        return null;
      };

      const launchClaire = async () => {
        setSpeaking(false);

        const cfgReady = await waitFor(
          () => window.MAXWELLIAN_HUME && typeof window.MAXWELLIAN_HUME === "object",
          8000
        );
        if (!cfgReady) {
          console.error("Claire character config missing after package load.");
          return;
        }

        // Claire identity only. Not page-aware.
        // OpenAI Live (Willow) — same transport as working experience-clerk (Vesper).
        window.MAXWELLIAN_HUME_RUNTIME_AUTH_ENDPOINT = "";
        window.MAXWELLIAN_RUNTIME_AUTH_ENDPOINT = "";
        window.MAXWELLIAN_HUME.hume_runtime_auth_endpoint = "";
        window.MAXWELLIAN_HUME.allow_hume_authless_connect = false;
        window.MAXWELLIAN_HUME.voice_engine = "openai";
        window.MAXWELLIAN_HUME.openai_live_api = true;
        window.MAXWELLIAN_HUME.openai_voice = "willow";
        window.MAXWELLIAN_HUME.openai_realtime_model = "gpt-live-1";
        window.MAXWELLIAN_HUME.allow_openai_fallback = false;
        window.MAXWELLIAN_HUME.openai_session_endpoint = "/api/openai/realtime/session";
        window.MAXWELLIAN_HUME.openai_live_session_endpoint = "/api/openai/live/session";
        window.MAXWELLIAN_HUME.openai_renderer_url = "./assets/kuranda/clare/openai_renderer/index.html?v=20261103-claire-blue-rings-1";
        window.MAXWELLIAN_HUME.openai_embed_url = "./assets/kuranda/clare/openai_renderer/index.html?v=20261103-claire-blue-rings-1";
        window.MAXWELLIAN_HUME.embed_url = "./assets/kuranda/clare/openai_renderer/index.html?v=20261103-claire-blue-rings-1";
        window.MAXWELLIAN_HUME.renderer_url = "./assets/kuranda/clare/openai_renderer/index.html?v=20261103-claire-blue-rings-1";
        window.MAXWELLIAN_HUME.hume_embed_url = "./assets/kuranda/clare/openai_renderer/index.html?v=20261103-claire-blue-rings-1";
        window.MAXWELLIAN_HUME.voice_id = "willow";
        window.MAXWELLIAN_HUME.config_id = "";
        window.MAXWELLIAN_HUME.hume_voice_id = "";
        window.MAXWELLIAN_HUME.hume_config_id = "";
        window.MAXWELLIAN_HUME.lock_character_to_default = true;
        window.MAXWELLIAN_HUME.use_unity_start_gate = true;
        window.MAXWELLIAN_HUME.preflight_microphone_on_launch = false;
        window.MAXWELLIAN_HUME.start_button_waiting_label = "Claire is ready";
        window.MAXWELLIAN_HUME.start_button_close_label = "Pause Claire";
        try {
          if (window.ClerkVoiceWidget && typeof window.ClerkVoiceWidget.setEngine === "function") {
            window.ClerkVoiceWidget.setEngine("openai");
          }
        } catch (e) {}
        window.MAXWELLIAN_HUME.character_name = "Claire";
        window.MAXWELLIAN_HUME.character_id = "claire-charcot";
        window.MAXWELLIAN_HUME.default_character_id = "claire-charcot";
        window.MAXWELLIAN_HUME.floating_launcher_enabled = false;
        window.MAXWELLIAN_HUME.default_context_source = "kuranda-claire";
        window.MAXWELLIAN_HUME.content_awareness_mode = false;
        window.MAXWELLIAN_HUME.content_awareness_scope_lock = false;
        window.MAXWELLIAN_HUME.clerk_page_access_control_enabled = false;
        window.MAXWELLIAN_HUME.session_context_char_limit = 24000;
        window.MAXWELLIAN_HUME.library_research_enabled = true;
        window.MAXWELLIAN_HUME.library_research_status_label = "Researching";
        window.MAXWELLIAN_HUME.library_research_hold_line = "Hold on while I check the Kuranda Library.";
        // Hard-disable page/pattern context injection for Claire.
        try {
          window.MAXWELLIAN_HUME.disable_page_context = true;
          window.MAXWELLIAN_HUME.page_context_enabled = false;
          window.MAXWELLIAN_HUME.prefetch_active_page_context = false;
          window.MAXWELLIAN_HUME.include_page_context = false;
          window.MAXWELLIAN_HUME.content_awareness_page_source_files = {};
        } catch (e) {}

        // Load Claire identity + Kuranda library pack (host-level context, not page-aware).
        let claireIdentityPack = "";
        let claireKnowledgePack = "";
        try {
          const packUrl = "./assets/kuranda/clare/knowledge/CLAIRE_IDENTITY_PACK.md?v=20260813-0213";
          const resp = await fetch(packUrl, { cache: "no-store" });
          if (resp && resp.ok) claireIdentityPack = await resp.text();
        } catch (e) {
          console.warn("Claire identity pack fetch failed; using compact fallback.", e);
        }
        try {
          const knowledgeUrl = "./assets/kuranda/clare/knowledge/CLAIRE_DEMO_KNOWLEDGE_PACK.md?v=20260810-claire-library1";
          const knowledgeResp = await fetch(knowledgeUrl, { cache: "no-store" });
          if (knowledgeResp && knowledgeResp.ok) claireKnowledgePack = await knowledgeResp.text();
        } catch (e) {
          console.warn("Claire knowledge pack fetch failed; using compact fallback.", e);
        }
        if (!claireIdentityPack || claireIdentityPack.length < 200) {
          claireIdentityPack =
            "You are Claire with Kuranda Mind & Body, public guide only. " +
            "Everyday name Claire. Formal only if asked: Dr. Claire Charcot, PhD (Charcot=Charco). " +
            "Delton Hyatt is authority; Isaiah is private partner. " +
            "Not page-aware. Not demo-aware. Know who you are from onboard/bio. " +
            "No diagnosis/cure promises. " +
            "First turn monologue required (bio history). May I ask who I'm speaking with—just your first name so we can talk? We can get more details later if you'd like to learn more.";
        }
        if (!claireKnowledgePack || claireKnowledgePack.length < 200) {
          claireKnowledgePack =
            "KURANDA LIBRARY DEMO CONTEXT:\n" +
            "- Claire is connected to Kuranda Library material for grounded discussion.\n" +
            "- Discuss evolving research on vibration, sensory regulation, and well-being with safety guardrails.\n" +
            "- Never promise cures or diagnosis, and never mention page numbers or page layout.\n";
        }

        const openingLine = "Hello, how are you today? My name is Dr. Claire Charcot. You can call me Claire. I serve as the Chief Clinical Scientist for Kuranda Mind & Body Institute, and as your Cognition Host during your visit. Before we begin, a little context. My identity was inspired by the French neurologist Jean-Martin Charcot, whose careful observations helped shape modern neurology. He noticed that many people with Parkinson's felt calmer after travel over rough roads or rails, and he wondered whether vibration itself might influence the nervous system—work that led to one of the earliest therapeutic vibratory chairs. More than a century later, our founder, Mr. Hyatt, began asking similar questions—not only as a researcher, but from lived experience. His search is personal: what helps, why it helps, and how modern tools can reveal patterns earlier generations could not see. My role is to stand with Kuranda as Cognition Host—to study our knowledge carefully, help you understand our work, and carry forward that same spirit of observation. Now, how might I answer your questions?";

        const operatingLine =
          "NOT PAGE-AWARE. Never mention page numbers or page 7. " +
          "FIRST TURN: Recite Claire bio monologue word-for-word. " +
          "Refer to our founder as Mr. Hyatt. " +
          "Do not ask for name in first turn. End with: Now, how might I answer your questions? " +
          "Monologue: " + openingLine;

        // Session context = identity pack + Kuranda library pack.
        window.MAXWELLIAN_HUME.session_context =
          operatingLine +
          "\n\n--- CLAIRE IDENTITY PACK ---\n" + claireIdentityPack +
          "\n\n--- KURANDA LIBRARY PACK ---\n" + claireKnowledgePack;
        window.MAXWELLIAN_HUME.system_prompt_text =
          "You are Claire connected to Kuranda Library context. " + operatingLine + " Opening line: " + openingLine;
        if (window.MAXWELLIAN_HUME.session_variables) {
          window.MAXWELLIAN_HUME.session_variables.character_name = "Claire";
          window.MAXWELLIAN_HUME.session_variables.opening_line = openingLine;
          window.MAXWELLIAN_HUME.session_variables.name_request_line =
            "May I ask who I'm speaking with—just your first name so we can talk?";
          window.MAXWELLIAN_HUME.session_variables.library_prep = "identity-pack-plus-kuranda-library";
          window.MAXWELLIAN_HUME.session_variables.library_authority = "Kuranda Library";
          window.MAXWELLIAN_HUME.session_variables.bio_source =
            "SpeakWithClaireOnBoard + Internal Identity Narrative";
          window.MAXWELLIAN_HUME.session_variables.must_know_bio = "true";
          window.MAXWELLIAN_HUME.session_variables.page_aware = "false";
          window.MAXWELLIAN_HUME.session_variables.content_aware = "false";
        }
        try {
          window.MAXWELLIAN_HUME.opening_line = openingLine;
          try {
          window.MAXWELLIAN_HUME.unknown_answer_fallback = "I do not have enough approved Kuranda Library context for that yet. Hold on while I check the Kuranda Library.";
        } catch (e) {}
        window.MAXWELLIAN_HUME.engagement_protocol = "First turn: spirit-guided Claire identity introduction (not a rigid script). Name-curiosity hook, then answer questions. Not page-aware.";
        } catch (e) {}

        const launcher = await waitFor(() => {
          if (typeof window.launchClerkWithPageContext === "function") return window.launchClerkWithPageContext;
          if (typeof window.launchClerk === "function") return window.launchClerk;
          if (typeof window.openClerkVoiceModal === "function") return window.openClerkVoiceModal;
          return null;
        }, 8000);

        if (!launcher) {
          console.error("[Claire] voice launcher unavailable after package load.");
          setSpeaking(true);
          return;
        }

        console.info("[Claire] launching OpenAI Live Willow session via", launcher.name || "launcher");
        try {
          const result = launcher({
            characterId: "claire-charcot",
            contextSource: "kuranda-claire",
            // Keep keys for launcher compatibility, but payload forbids page awareness.
            pageKey: "claire-session",
            entryPoint: "kuranda-claire-meet",
            uiMode: "modal",
            disablePageContext: true,
            includePageContext: false,
            contextPayload: {
              voice_engine_preference: "openai",
              openai_voice: "willow",
              voice_id: "willow",
              openai_realtime_model: "gpt-live-1",
              openai_live_session_endpoint: "/api/openai/live/session",
              openai_realtime_model: "gpt-live-1",
              openai_live_session_endpoint: (window.MAXWELLIAN_HUME && window.MAXWELLIAN_HUME.openai_live_session_endpoint) || "/api/openai/live/session",
              openai_session_endpoint: (window.MAXWELLIAN_HUME && window.MAXWELLIAN_HUME.openai_session_endpoint) || "/api/openai/realtime/session",
              openai_renderer_url: (window.MAXWELLIAN_HUME && window.MAXWELLIAN_HUME.openai_renderer_url) || "./assets/kuranda/clare/openai_renderer/index.html",
              embed_url: (window.MAXWELLIAN_HUME && window.MAXWELLIAN_HUME.embed_url) || "./assets/kuranda/clare/openai_renderer/index.html",
              organization: "Kuranda Mind & Body",
              public_guide: "Claire",
              page_aware: false,
              content_aware: false,
              identity_pack: "CLAIRE_IDENTITY_PACK",
              opening_expectation: openingLine
            }
          });
          if (result && typeof result.then === "function") {
            await result;
          }
          setSpeaking(false);
        } catch (err) {
          console.error("Claire auto-launch failed", err);
          setSpeaking(true);
        }
      };

      
      // CLAIRE_BUBBLE_SPEAK_SYNC
      // Orb/bars animate only while Claire is actively speaking.
      window.setKurandaClaireSpeaking = setSpeaking;
      window.stopKurandaClaireBubble = function () {
        setSpeaking(false);
        document.body.classList.remove("claire-is-speaking");
      };
      window.startKurandaClaireBubble = function () {
        setSpeaking(true);
        document.body.classList.add("claire-is-speaking");
      };

      // Default frozen.
      setSpeaking(false);

      // Listen for widget speech/close signals.
      const armClaireSpeaking = function (on) {
        try { setSpeaking(Boolean(on)); } catch (e) {}
        try {
          document.body.classList.toggle("claire-is-speaking", Boolean(on));
          document.body.classList.toggle("claire-host-active", true);
        } catch (e) {}
        try {
          if (typeof window.startKurandaClaireBubble === "function" && on) window.startKurandaClaireBubble();
          if (typeof window.stopKurandaClaireBubble === "function" && !on) window.stopKurandaClaireBubble();
        } catch (e) {}
      };

      window.addEventListener("message", function (event) {
        const data = event && event.data;
        if (!data || typeof data !== "object") return;
        const t = String(data.type || data.event || "").toLowerCase();
        if (!t) return;
        // OpenAI Live renderer + widget speech signals
        if (
          t === "audio_start" ||
          t === "audio_output" ||
          t === "assistant_speak_start" ||
          t === "transcript_message" ||
          t === "assistant_message" ||
          t.includes("assistant_speak") ||
          t.includes("tts_start") ||
          t.includes("audio_output_start") ||
          t.includes("response.audio")
        ) {
          if (data.payload && (data.payload.role === "user" || data.payload.speaker === "user")) {
            armClaireSpeaking(false);
          } else {
            armClaireSpeaking(true);
          }
          return;
        }
        if (
          t === "audio_end" ||
          t === "assistant_end" ||
          t === "assistant_speak_end" ||
          t.includes("tts_end") ||
          t.includes("audio_output_end") ||
          t === "collapse_widget" ||
          t.includes("session_stopped")
        ) {
          armClaireSpeaking(false);
          return;
        }
      });

      // Parent-level custom events (widget may rebroadcast)
      window.addEventListener("clerk-voice-audio-start", function () { armClaireSpeaking(true); });
      window.addEventListener("hume-audio-start", function () { armClaireSpeaking(true); });
      window.addEventListener("clerk-voice-audio-stop", function () { armClaireSpeaking(false); });
      window.addEventListener("hume-audio-stop", function () { armClaireSpeaking(false); });

      // SELECT label → speaking cue (Curl pattern): Stop Listening / Pause Claire
      const watchStartBtn = function () {
        const btn = document.getElementById("clerkVoiceStartBtn");
        if (!btn || btn.dataset.claireRingWatch === "1") return;
        btn.dataset.claireRingWatch = "1";
        const mo = new MutationObserver(function () {
          const label = String(btn.textContent || "").toLowerCase();
          if (/stop listening|pause claire|pause curl/.test(label)) armClaireSpeaking(true);
        });
        mo.observe(btn, { characterData: true, childList: true, subtree: true });
      };
      watchStartBtn();
      window.setInterval(watchStartBtn, 1200);

      // If modal closes, freeze bubble.
      document.addEventListener("click", function (e) {
        const t = e.target;
        if (!t) return;
        if (t.id === "clerkVoiceCloseBtn" || (t.classList && t.classList.contains("clerk-voice-close"))) {
          setSpeaking(false);
          document.body.classList.remove("claire-is-speaking");
        }
      }, true);

      // Bind Back to hard-stop voice before traverse to page 1
      try {
        if (returnLink && returnLink.dataset.claireBackBound !== "1") {
          returnLink.dataset.claireBackBound = "1";
          returnLink.addEventListener("click", function (ev) {
            try { hardStopClaireVoice(); } catch (e) {}
            // allow default navigation; add cache buster
            try {
              ev.preventDefault();
              hardStopClaireVoice();
              window.setTimeout(function () {
                window.location.href = "./experience-claire-entry.html?v=20261103-claire-start-fix-1&from=claire-back";
              }, 40);
            } catch (e) {
              // fall through
            }
          });
        }
      } catch (e) {}

      window.setTimeout(() => {
        void launchClaire();
      }, 200);
      
      // CLAIRE_SOFT_RESET_AFTER_STOP
      // Pause Claire ends audio; soft re-arm so Waiting works without Back.
      const softRearmClaire = async function () {
        try {
          if (typeof window.stopKurandaClaireBubble === "function") window.stopKurandaClaireBubble();
        } catch (e) {}
        try { document.body.classList.remove("claire-is-speaking"); } catch (e) {}
        try {
          const b = document.getElementById("clerkVoiceStartBtn");
          if (b) {
            b.disabled = false;
            b.removeAttribute("disabled");
            b.hidden = false;
            b.style.display = "flex";
            b.style.visibility = "visible";
            b.style.opacity = "1";
            b.style.pointerEvents = "auto";
            b.setAttribute("data-claire-state", "waiting");
            b.textContent = "Claire is ready";
          }
        } catch (e) {}
        // Re-run the same prep as first load so next SELECT has a live session path.
        try {
          await launchClaire();
        } catch (e) {
          console.warn("Claire soft re-arm failed", e);
        }
      };
      window.addEventListener("claireStopListeningReset", function () {
        if (document.visibilityState === "hidden") return;
        window.setTimeout(function () {
          if (document.visibilityState === "hidden") return;
          void softRearmClaire();
        }, 60);
      });
      window.addEventListener("clerkVoiceModalClosed", function () {
        // If stop left us on Waiting, keep orb frozen and control ready.
        try {
          if (typeof window.stopKurandaClaireBubble === "function") window.stopKurandaClaireBubble();
        } catch (e) {}
      });

      // CLAIRE_FORCE_ENABLE_WAITING
      window.setTimeout(function () {
        try {
          const b = document.getElementById("clerkVoiceStartBtn");
          if (!b) return;
          const st = String(b.getAttribute("data-claire-state") || "");
          const label = String(b.textContent || "").trim().toLowerCase();
          if (st === "close-ready" || st === "connecting" || label === "pause claire" || label === "stop-listening") return;
          b.disabled = false;
          b.removeAttribute("disabled");
          b.hidden = false;
          b.style.display = "flex";
          b.style.visibility = "visible";
          b.style.opacity = "1";
          b.style.pointerEvents = "auto";
          b.setAttribute("data-claire-state", "waiting");
          b.textContent = "Claire is ready";
        } catch (e) {}
      }, 800);
    })();
  </script>
