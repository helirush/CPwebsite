  <script src="../../UnityEnergy/founder_share_panel.js?v=20260731b" onerror="this.onerror=null;this.src='https://unityenergy.com/UnityEnergy/founder_share_panel.js?v=20260731b';"></script>
  <script>
    (() => {
      const returnLink = document.getElementById("page7-return-link");
      const bubbleEl = document.getElementById("kuranda-speaking-bubble");
      if (!returnLink || !bubbleEl) return;

      const setSpeaking = (on) => {
        bubbleEl.classList.toggle("is-speaking", Boolean(on));
      };

      const waitFor = async (testFn, timeoutMs = 10000) => {
        const start = Date.now();
        while (Date.now() - start < timeoutMs) {
          const value = testFn();
          if (value) return value;
          await new Promise((r) => setTimeout(r, 40));
        }
        return null;
      };

      const launchClaire = async () => {
        setSpeaking(false);

        const cfgReady = await waitFor(
          () => window.MAXWELLIAN_HUME && typeof window.MAXWELLIAN_HUME === "object",
          8000
        );
        if (!cfgReady) {
          console.error("Claire character config missing after package load.");
          return;
        }

        // Claire identity + Kuranda library prep for demo intelligence.
        window.MAXWELLIAN_HUME.character_name = "Claire";
        window.MAXWELLIAN_HUME.character_id = "claire-charcot";
        window.MAXWELLIAN_HUME.default_character_id = "claire-charcot";
        window.MAXWELLIAN_HUME.floating_launcher_enabled = false;
        window.MAXWELLIAN_HUME.default_context_source = "kuranda-claire-demo";
        window.MAXWELLIAN_HUME.content_awareness_mode = false;
        window.MAXWELLIAN_HUME.clerk_page_access_control_enabled = false;

        // CLAIRE_LIBRARY_PREP: load compact onboard + identity + library digest.
        // Keep this compact (not the giant full pack) so voice still launches.
        let claireBrief = "";
        try {
          const briefUrl = "./assets/kuranda/clare/knowledge/CLAIRE_DEMO_RUNTIME_BRIEF.md?v=20260804-1722";
          const resp = await fetch(briefUrl, { cache: "no-store" });
          if (resp && resp.ok) {
            claireBrief = await resp.text();
          }
        } catch (e) {
          console.warn("Claire runtime brief fetch failed; using compact fallback.", e);
        }
        if (!claireBrief || claireBrief.length < 200) {
          claireBrief =
            "You are Claire, public guide for Kuranda Mind & Body. " +
            "Absorb onboard/identity privately. Everyday name Claire only. " +
            "Formal only if asked: Dr. Claire Charcot, PhD (Charcot=Charco). " +
            "Delton Hyatt is authority; Isaiah is private partner. " +
            "Use approved Kuranda Library concepts only. No diagnosis/cure promises. " +
            "First turn: Hi, I'm Claire with Kuranda Mind & Body. May I ask who I'm speaking with—just your first name so we can talk? We can get more details later if you'd like to learn more.";
        }

        const openingLine = "Hi, I'm Claire with Kuranda Mind & Body. May I ask who I'm speaking with—just your first name so we can talk? We can get more details later if you'd like to learn more.";
        const operatingLine =
          "Before you speak, absorb the Claire Demo Runtime Brief (onboard, internal identity narrative, and Kuranda Library digest). " +
          "Do not recite documents. " +
          "First spoken turn must introduce yourself before asking for a name: Hi, I'm Claire with Kuranda Mind & Body. Then ask: May I ask who I'm speaking with—just your first name so we can talk? Add gently that more details can come later if they want to learn more. Do not rush straight to the name ask without saying who you are and Kuranda Mind & Body. Everyday name Claire only. No last name, PhD, or title in the opening. " +
          "After they share a first name, use it warmly. Then help from approved library knowledge. " +
          "Stay calm, short, and clear. No diagnosis. No cure promises.";

        window.MAXWELLIAN_HUME.session_context =
          operatingLine + "\n\n--- CLAIRE DEMO RUNTIME BRIEF ---\n" + claireBrief;
        window.MAXWELLIAN_HUME.system_prompt_text =
          "You are Claire. " + operatingLine + " Opening line: " + openingLine;
        if (window.MAXWELLIAN_HUME.session_variables) {
          window.MAXWELLIAN_HUME.session_variables.character_name = "Claire";
          window.MAXWELLIAN_HUME.session_variables.opening_line = openingLine;
          window.MAXWELLIAN_HUME.session_variables.name_request_line = "May I ask who I'm speaking with—just your first name so we can talk?";
          window.MAXWELLIAN_HUME.session_variables.library_prep = "runtime-brief-loaded";
        }
        // Also stamp engagement fields if present on config object.
        try {
          window.MAXWELLIAN_HUME.opening_line = openingLine;
          if (window.MAXWELLIAN_HUME.engagement_protocol) {
            window.MAXWELLIAN_HUME.engagement_protocol =
              "Absorb onboard + identity + library brief first. " +
              "Open with identity then first-name ask: Hi, I'm Claire with Kuranda Mind & Body, then ask first name only. " +
              "Then guide from approved Kuranda Library knowledge only.";
          }
        } catch (e) {}

        const launcher = await waitFor(() => {
          if (typeof window.launchClerkWithPageContext === "function") return window.launchClerkWithPageContext;
          if (typeof window.launchClerk === "function") return window.launchClerk;
          if (typeof window.openClerkVoiceModal === "function") return window.openClerkVoiceModal;
          return null;
        }, 8000);

        if (!launcher) {
          console.error("Claire voice launcher unavailable.");
          return;
        }

        try {
          const result = launcher({
            characterId: "claire-charcot",
            contextSource: "kuranda-claire-demo",
            pageKey: "page7",
            entryPoint: "cp-page6-meet-claire",
            uiMode: "modal",
            contextPayload: {
              organization: "Kuranda Mind & Body",
              public_guide: "Claire",
              demo_mode: true,
              opening_expectation: "Hi, I'm Claire with Kuranda Mind & Body. May I ask who I'm speaking with—just your first name so we can talk? We can get more details later if you'd like to learn more."
            }
          });
          if (result && typeof result.then === "function") {
            await result;
          }
          setSpeaking(false);
        } catch (err) {
          console.error("Claire auto-launch failed", err);
          setSpeaking(true);
        }
      };

      
      // CLAIRE_BUBBLE_SPEAK_SYNC
      // Orb/bars animate only while Claire is actively speaking.
      window.setKurandaClaireSpeaking = setSpeaking;
      window.stopKurandaClaireBubble = function () {
        setSpeaking(false);
        document.body.classList.remove("claire-is-speaking");
      };
      window.startKurandaClaireBubble = function () {
        setSpeaking(true);
        document.body.classList.add("claire-is-speaking");
      };

      // Default frozen.
      setSpeaking(false);

      // Listen for widget speech/close signals.
      window.addEventListener("message", function (event) {
        const data = event && event.data;
        if (!data || typeof data !== "object") return;
        const t = String(data.type || "").toLowerCase();
        if (!t) return;
        if (t === "transcript_message" || t === "assistant_message" || t === "audio_start" || t.includes("assistant_speak") || t.includes("tts_start")) {
          // Animate while Claire output is flowing.
          if (data.payload && (data.payload.role === "user" || data.payload.speaker === "user")) {
            // user speech: keep orb calm/frozen
            setSpeaking(false);
            document.body.classList.remove("claire-is-speaking");
          } else {
            setSpeaking(true);
            document.body.classList.add("claire-is-speaking");
          }
          return;
        }
        if (t === "audio_end" || t === "assistant_end" || t.includes("tts_end") || t === "collapse_widget") {
          setSpeaking(false);
          document.body.classList.remove("claire-is-speaking");
          return;
        }
      });

      // If modal closes, freeze bubble.
      document.addEventListener("click", function (e) {
        const t = e.target;
        if (!t) return;
        if (t.id === "clerkVoiceCloseBtn" || (t.classList && t.classList.contains("clerk-voice-close"))) {
          setSpeaking(false);
          document.body.classList.remove("claire-is-speaking");
        }
      }, true);

      window.setTimeout(() => {
        void launchClaire();
      }, 200);
      
      // CLAIRE_SOFT_RESET_AFTER_STOP
      // Stop-Listening ends audio; soft re-arm so Waiting works without Back.
      const softRearmClaire = async function () {
        try {
          if (typeof window.stopKurandaClaireBubble === "function") window.stopKurandaClaireBubble();
        } catch (e) {}
        try { document.body.classList.remove("claire-is-speaking"); } catch (e) {}
        try {
          const b = document.getElementById("clerkVoiceStartBtn");
          if (b) {
            b.disabled = false;
            b.removeAttribute("disabled");
            b.hidden = false;
            b.style.display = "flex";
            b.style.visibility = "visible";
            b.style.opacity = "1";
            b.style.pointerEvents = "auto";
            b.setAttribute("data-claire-state", "waiting");
            b.textContent = "Waiting on Claire";
          }
        } catch (e) {}
        // Re-run the same prep as first load so next SELECT has a live session path.
        try {
          await launchClaire();
        } catch (e) {
          console.warn("Claire soft re-arm failed", e);
        }
      };
      window.addEventListener("claireStopListeningReset", function () {
        window.setTimeout(function () { void softRearmClaire(); }, 60);
      });
      window.addEventListener("clerkVoiceModalClosed", function () {
        // If stop left us on Waiting, keep orb frozen and control ready.
        try {
          if (typeof window.stopKurandaClaireBubble === "function") window.stopKurandaClaireBubble();
        } catch (e) {}
      });

      // CLAIRE_FORCE_ENABLE_WAITING
      window.setTimeout(function () {
        try {
          const b = document.getElementById("clerkVoiceStartBtn");
          if (!b) return;
          const st = String(b.getAttribute("data-claire-state") || "");
          const label = String(b.textContent || "").trim().toLowerCase();
          if (st === "close-ready" || st === "connecting" || label === "stop-listening") return;
          b.disabled = false;
          b.removeAttribute("disabled");
          b.hidden = false;
          b.style.display = "flex";
          b.style.visibility = "visible";
          b.style.opacity = "1";
          b.style.pointerEvents = "auto";
          b.setAttribute("data-claire-state", "waiting");
          b.textContent = "Waiting on Claire";
        } catch (e) {}
      }, 800);
    })();
  </script>
