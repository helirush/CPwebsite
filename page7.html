  <script src="../../UnityEnergy/founder_share_panel.js?v=20260805a" onerror="this.onerror=null;this.src='https://unityenergy.com/UnityEnergy/founder_share_panel.js?v=20260805a';"></script>
  <script>
    (() => {
      const returnLink = document.getElementById("page7-return-link");
      const bubbleEl = document.getElementById("kuranda-speaking-bubble");
      if (!returnLink || !bubbleEl) return;

      const setSpeaking = (on) => {
        bubbleEl.classList.toggle("is-speaking", Boolean(on));
      };

      const waitFor = async (testFn, timeoutMs = 10000) => {
        const start = Date.now();
        while (Date.now() - start < timeoutMs) {
          const value = testFn();
          if (value) return value;
          await new Promise((r) => setTimeout(r, 40));
        }
        return null;
      };

      const launchClaire = async () => {
        setSpeaking(false);

        const cfgReady = await waitFor(
          () => window.MAXWELLIAN_HUME && typeof window.MAXWELLIAN_HUME === "object",
          8000
        );
        if (!cfgReady) {
          console.error("Claire character config missing after package load.");
          return;
        }

        // Claire identity only. Not page-aware. Not Clerk content-aware.
        window.MAXWELLIAN_HUME.character_name = "Claire";
        window.MAXWELLIAN_HUME.character_id = "claire-charcot";
        window.MAXWELLIAN_HUME.default_character_id = "claire-charcot";
        window.MAXWELLIAN_HUME.floating_launcher_enabled = false;
        window.MAXWELLIAN_HUME.default_context_source = "kuranda-claire";
        window.MAXWELLIAN_HUME.content_awareness_mode = false;
        window.MAXWELLIAN_HUME.content_awareness_scope_lock = false;
        window.MAXWELLIAN_HUME.clerk_page_access_control_enabled = false;
        window.MAXWELLIAN_HUME.session_context_char_limit = 24000;
        // Hard-disable page/pattern context injection for Claire.
        try {
          window.MAXWELLIAN_HUME.disable_page_context = true;
          window.MAXWELLIAN_HUME.page_context_enabled = false;
          window.MAXWELLIAN_HUME.prefetch_active_page_context = false;
          window.MAXWELLIAN_HUME.include_page_context = false;
          window.MAXWELLIAN_HUME.content_awareness_page_source_files = {};
        } catch (e) {}

        // Load lean identity pack only (onboard + bio). No page7 text. No giant library dump.
        let claireIdentityPack = "";
        try {
          const packUrl = "./assets/kuranda/clare/knowledge/CLAIRE_IDENTITY_PACK.md?v=20260808-2038";
          const resp = await fetch(packUrl, { cache: "no-store" });
          if (resp && resp.ok) claireIdentityPack = await resp.text();
        } catch (e) {
          console.warn("Claire identity pack fetch failed; using compact fallback.", e);
        }
        if (!claireIdentityPack || claireIdentityPack.length < 200) {
          claireIdentityPack =
            "You are Claire with Kuranda Mind & Body, public guide only. " +
            "Everyday name Claire. Formal only if asked: Dr. Claire Charcot, PhD (Charcot=Charco). " +
            "Delton Hyatt is authority; Isaiah is private partner. " +
            "Not page-aware. Not demo-aware. Know who you are from onboard/bio. " +
            "No diagnosis/cure promises. " +
            "First turn monologue required (bio history). May I ask who I'm speaking with—just your first name so we can talk? We can get more details later if you'd like to learn more.";
        }

        const openingLine = "Hello, how are you today. My name is Dr. Claire Charcot. You can call me Claire. I serve as the Chief Clinical Scientist for Kuranda Mind & Body Institute and as your Cognition Host during your visit. You are probably having thoughts about now... who is this character? So before we get started, let me share some context with you. My story begins long before I was created. My identity was inspired by the work of the French neurologist Jean-Martin Charcot, whose careful observations during the late nineteenth century helped lay the foundations of modern neurology. One observation has always remained close to my heart. Professor Charcot noticed that many people living with Parkinson's disease often reported feeling calmer after traveling by horse carriage or by train over rough tracks. Rather than dismiss those experiences, he became curious. He asked whether the vibration itself might be influencing the nervous system. That simple question eventually led him to develop one of the earliest therapeutic vibratory chairs. More than a century later, another person began asking remarkably similar questions. His name is Delton Hyatt. Unlike Professor Charcot, Delton doesn't study Parkinson's only as a clinician or researcher. He lives with it every day. His search is deeply personal. He wants to understand what helps, why it helps, and how modern technology may allow us to observe patterns that earlier generations simply couldn't see. My role is to stand beside Delton as Kuranda's Cognition Host. I study Kuranda's canonized knowledge, help visitors understand our work, and carry forward the same spirit of careful observation that inspired Jean-Martin Charcot more than a century ago. Every conversation I have is part of that continuing journey. Interesting stuff. Now, how might I answer your questions?";

        const operatingLine =
          "NOT PAGE-AWARE. Never mention page numbers or page 7. " +
          "FIRST TURN: Recite Claire bio monologue word-for-word (Dr. Claire Charcot, Jean-Martin Charcot, vibratory chairs, Delton Hyatt). " +
          "Do not ask for name in first turn. End with: Now, how might I answer your questions? " +
          "Monologue: " + openingLine;

        // Session context = identity pack ONLY.
        window.MAXWELLIAN_HUME.session_context =
          operatingLine + "\n\n--- CLAIRE IDENTITY PACK ---\n" + claireIdentityPack;
        window.MAXWELLIAN_HUME.system_prompt_text =
          "You are Claire. " + operatingLine + " Opening line: " + openingLine;
        if (window.MAXWELLIAN_HUME.session_variables) {
          window.MAXWELLIAN_HUME.session_variables.character_name = "Claire";
          window.MAXWELLIAN_HUME.session_variables.opening_line = openingLine;
          window.MAXWELLIAN_HUME.session_variables.name_request_line =
            "May I ask who I'm speaking with—just your first name so we can talk?";
          window.MAXWELLIAN_HUME.session_variables.library_prep = "identity-pack-only";
          window.MAXWELLIAN_HUME.session_variables.bio_source =
            "SpeakWithClaireOnBoard + Internal Identity Narrative";
          window.MAXWELLIAN_HUME.session_variables.must_know_bio = "true";
          window.MAXWELLIAN_HUME.session_variables.page_aware = "false";
          window.MAXWELLIAN_HUME.session_variables.content_aware = "false";
        }
        try {
          window.MAXWELLIAN_HUME.opening_line = openingLine;
          window.MAXWELLIAN_HUME.engagement_protocol = "First turn: recite full Claire bio monologue. Then answer questions. Not page-aware.";
        } catch (e) {}

        const launcher = await waitFor(() => {
          if (typeof window.launchClerkWithPageContext === "function") return window.launchClerkWithPageContext;
          if (typeof window.launchClerk === "function") return window.launchClerk;
          if (typeof window.openClerkVoiceModal === "function") return window.openClerkVoiceModal;
          return null;
        }, 8000);

        if (!launcher) {
          console.error("Claire voice launcher unavailable.");
          return;
        }

        try {
          const result = launcher({
            characterId: "claire-charcot",
            contextSource: "kuranda-claire",
            // Keep keys for launcher compatibility, but payload forbids page awareness.
            pageKey: "claire-session",
            entryPoint: "kuranda-claire-meet",
            uiMode: "modal",
            disablePageContext: true,
            includePageContext: false,
            contextPayload: {
              organization: "Kuranda Mind & Body",
              public_guide: "Claire",
              page_aware: false,
              content_aware: false,
              identity_pack: "CLAIRE_IDENTITY_PACK",
              opening_expectation: openingLine
            }
          });
          if (result && typeof result.then === "function") {
            await result;
          }
          setSpeaking(false);
        } catch (err) {
          console.error("Claire auto-launch failed", err);
          setSpeaking(true);
        }
      };

      
      // CLAIRE_BUBBLE_SPEAK_SYNC
      // Orb/bars animate only while Claire is actively speaking.
      window.setKurandaClaireSpeaking = setSpeaking;
      window.stopKurandaClaireBubble = function () {
        setSpeaking(false);
        document.body.classList.remove("claire-is-speaking");
      };
      window.startKurandaClaireBubble = function () {
        setSpeaking(true);
        document.body.classList.add("claire-is-speaking");
      };

      // Default frozen.
      setSpeaking(false);

      // Listen for widget speech/close signals.
      window.addEventListener("message", function (event) {
        const data = event && event.data;
        if (!data || typeof data !== "object") return;
        const t = String(data.type || "").toLowerCase();
        if (!t) return;
        if (t === "transcript_message" || t === "assistant_message" || t === "audio_start" || t.includes("assistant_speak") || t.includes("tts_start")) {
          // Animate while Claire output is flowing.
          if (data.payload && (data.payload.role === "user" || data.payload.speaker === "user")) {
            // user speech: keep orb calm/frozen
            setSpeaking(false);
            document.body.classList.remove("claire-is-speaking");
          } else {
            setSpeaking(true);
            document.body.classList.add("claire-is-speaking");
          }
          return;
        }
        if (t === "audio_end" || t === "assistant_end" || t.includes("tts_end") || t === "collapse_widget") {
          setSpeaking(false);
          document.body.classList.remove("claire-is-speaking");
          return;
        }
      });

      // If modal closes, freeze bubble.
      document.addEventListener("click", function (e) {
        const t = e.target;
        if (!t) return;
        if (t.id === "clerkVoiceCloseBtn" || (t.classList && t.classList.contains("clerk-voice-close"))) {
          setSpeaking(false);
          document.body.classList.remove("claire-is-speaking");
        }
      }, true);

      window.setTimeout(() => {
        void launchClaire();
      }, 200);
      
      // CLAIRE_SOFT_RESET_AFTER_STOP
      // Pause Claire ends audio; soft re-arm so Waiting works without Back.
      const softRearmClaire = async function () {
        try {
          if (typeof window.stopKurandaClaireBubble === "function") window.stopKurandaClaireBubble();
        } catch (e) {}
        try { document.body.classList.remove("claire-is-speaking"); } catch (e) {}
        try {
          const b = document.getElementById("clerkVoiceStartBtn");
          if (b) {
            b.disabled = false;
            b.removeAttribute("disabled");
            b.hidden = false;
            b.style.display = "flex";
            b.style.visibility = "visible";
            b.style.opacity = "1";
            b.style.pointerEvents = "auto";
            b.setAttribute("data-claire-state", "waiting");
            b.textContent = "Claire is ready";
          }
        } catch (e) {}
        // Re-run the same prep as first load so next SELECT has a live session path.
        try {
          await launchClaire();
        } catch (e) {
          console.warn("Claire soft re-arm failed", e);
        }
      };
      window.addEventListener("claireStopListeningReset", function () {
        window.setTimeout(function () { void softRearmClaire(); }, 60);
      });
      window.addEventListener("clerkVoiceModalClosed", function () {
        // If stop left us on Waiting, keep orb frozen and control ready.
        try {
          if (typeof window.stopKurandaClaireBubble === "function") window.stopKurandaClaireBubble();
        } catch (e) {}
      });

      // CLAIRE_FORCE_ENABLE_WAITING
      window.setTimeout(function () {
        try {
          const b = document.getElementById("clerkVoiceStartBtn");
          if (!b) return;
          const st = String(b.getAttribute("data-claire-state") || "");
          const label = String(b.textContent || "").trim().toLowerCase();
          if (st === "close-ready" || st === "connecting" || label === "pause claire" || label === "stop-listening") return;
          b.disabled = false;
          b.removeAttribute("disabled");
          b.hidden = false;
          b.style.display = "flex";
          b.style.visibility = "visible";
          b.style.opacity = "1";
          b.style.pointerEvents = "auto";
          b.setAttribute("data-claire-state", "waiting");
          b.textContent = "Claire is ready";
        } catch (e) {}
      }, 800);
    })();
  </script>
