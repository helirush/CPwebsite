  <script>
    (() => {
      // Page 1 entry: clear leftover Claire/Clerk modal state from page 2 back-nav.
      try {
        document.body.classList.remove(
          "claire-is-speaking",
          "claire-host-active",
          "curl-host-active",
          "curl-is-speaking"
        );
      } catch (e) {}
      try {
        const modal =
          document.getElementById("clerkVoiceModal") ||
          document.querySelector(".clerk-voice-modal");
        if (modal) {
          modal.classList.remove("is-open", "active", "show");
          modal.setAttribute("aria-hidden", "true");
          modal.style.display = "none";
        }
      } catch (e) {}

      // MEET CLAIRE button id is meet-claire-button (not page6-meet-claire).
      // Always hard-navigate to page 2 with a fresh cache stamp — do not depend on
      // stale clare_hume_config.json demo_page_url values.
      const CLAIRE_EXPERIENCE_URL =
        "./experience-claire.html?v=20261103-claire-blue-rings-1&from=entry";
      const meetClaireButton = document.getElementById("meet-claire-button");
      if (!meetClaireButton) {
        console.error("[Claire entry] meet-claire-button missing");
        return;
      }
      meetClaireButton.addEventListener("click", (event) => {
        try {
          event.preventDefault();
          event.stopPropagation();
        } catch (e) {}
        window.location.assign(CLAIRE_EXPERIENCE_URL);
      });
    })();
  </script>
