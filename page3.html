  <script src="../../UnityEnergy/founder_share_panel.js?v=20260805a" onerror="this.onerror=null;this.src='https://unityenergy.com/UnityEnergy/founder_share_panel.js?v=20260805a';"></script>
  <script>
    (() => {
      const audioEl = document.getElementById('cpR3NarrationAudio');
      const playBtn = document.getElementById('cpR3PlayButton');
      const pauseBtn = document.getElementById('cpR3PauseButton');
      const restartBtn = document.getElementById('cpR3RestartButton');
      const waveEl = document.getElementById('cpR3WhyWave');
      const waveCanvas = document.getElementById('cpR3WhyWaveCanvas');
      if (!audioEl || !playBtn || !pauseBtn || !restartBtn || !waveEl) return;
      const WAVE_STYLE = {
        sensitivity: 3.9,
        smoothing: 0.74,
        lineStep: 2,
        idleLevel: 0.3,
        idleIntensity: 2,
        liveBoost: 2.25,
        liveBarScale: 0.78,
        maxBarHeightRatio: 1,
        centerGlowAlpha: 0.7,
        responseLerp: 0.62
      };
      const canvasCtx = waveCanvas && waveCanvas.getContext ? waveCanvas.getContext('2d') : null;
      let audioCtx = null;
      let analyser = null;
      let analyserData = null;
      let mediaSourceNode = null;
      let waveRafId = 0;
      let profileState = [];
      const setWaveState = (state) => {
        waveEl.classList.toggle('is-playing', state === 'playing');
        waveEl.classList.toggle('is-paused', state === 'paused');
      };
      const ensureWaveCanvasSize = () => {
        if (!waveCanvas || !canvasCtx) return;
        const rect = waveCanvas.getBoundingClientRect();
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const width = Math.max(1, Math.floor(rect.width * dpr));
        const height = Math.max(1, Math.floor(rect.height * dpr));
        if (waveCanvas.width !== width || waveCanvas.height !== height) {
          waveCanvas.width = width;
          waveCanvas.height = height;
          canvasCtx.setTransform(1, 0, 0, 1, 0, 0);
          canvasCtx.scale(dpr, dpr);
        }
      };
      const ensureAudioAnalyser = async () => {
        if (!canvasCtx) return false;
        if (analyser) return true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;
        try {
          audioCtx = audioCtx || new AudioCtx();
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          mediaSourceNode = mediaSourceNode || audioCtx.createMediaElementSource(audioEl);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = WAVE_STYLE.smoothing;
          mediaSourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
          analyserData = new Float32Array(analyser.fftSize);
          waveEl.classList.add('has-live-wave');
          return true;
        } catch (_) {
          return false;
        }
      };
      const drawWaveBars = () => {
        if (!canvasCtx || !waveCanvas) return;
        ensureWaveCanvasSize();
        const width = waveCanvas.clientWidth || 0;
        const height = waveCanvas.clientHeight || 0;
        if (!width || !height) {
          waveRafId = requestAnimationFrame(drawWaveBars);
          return;
        }
        const centerY = height / 2;
        const maxHalfHeight = (height * WAVE_STYLE.maxBarHeightRatio) / 2;
        canvasCtx.clearRect(0, 0, width, height);
        const centerGlow = canvasCtx.createLinearGradient(0, 0, width, 0);
        centerGlow.addColorStop(0, 'rgba(228,184,106,0)');
        centerGlow.addColorStop(0.2, `rgba(228,184,106,${WAVE_STYLE.centerGlowAlpha})`);
        centerGlow.addColorStop(0.5, 'rgba(246,223,162,0.95)');
        centerGlow.addColorStop(0.8, `rgba(228,184,106,${WAVE_STYLE.centerGlowAlpha})`);
        centerGlow.addColorStop(1, 'rgba(228,184,106,0)');
        canvasCtx.strokeStyle = centerGlow;
        canvasCtx.lineWidth = 2.2;
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, centerY);
        canvasCtx.lineTo(width, centerY);
        canvasCtx.stroke();
        const barGradient = canvasCtx.createLinearGradient(0, 0, width, 0);
        barGradient.addColorStop(0, 'rgba(228,184,106,0)');
        barGradient.addColorStop(0.2, 'rgba(228,184,106,0.8)');
        barGradient.addColorStop(0.5, 'rgba(245,222,157,1)');
        barGradient.addColorStop(0.8, 'rgba(228,184,106,0.8)');
        barGradient.addColorStop(1, 'rgba(228,184,106,0)');
        canvasCtx.strokeStyle = barGradient;
        canvasCtx.lineWidth = 1.8;
        const isLive = analyser && !audioEl.paused && !audioEl.ended && audioEl.currentTime > 0;
        const pointCount = isLive
          ? Math.max(96, Math.floor(width / 1.75))
          : Math.max(72, Math.floor(width / 2.4));
        if (profileState.length !== pointCount) {
          profileState = new Array(pointCount).fill(WAVE_STYLE.idleLevel);
        }
        if (isLive && analyserData) {
          analyser.getFloatTimeDomainData(analyserData);
          for (let p = 0; p < pointCount; p += 1) {
            const centerIdx = Math.floor((p / (pointCount - 1)) * (analyserData.length - 1));
            let sum = 0;
            let count = 0;
            for (let k = -3; k <= 3; k += 1) {
              const idx = Math.max(0, Math.min(analyserData.length - 1, centerIdx + k));
              const v = analyserData[idx];
              sum += v * v;
              count += 1;
            }
            const rms = Math.sqrt(sum / Math.max(1, count));
            const envelope = 0.25 + 0.75 * Math.sin((p / Math.max(1, pointCount - 1)) * Math.PI);
            const target = Math.max(WAVE_STYLE.idleLevel * 0.8, Math.min(1, rms * WAVE_STYLE.sensitivity * 4.4 * WAVE_STYLE.liveBoost) * envelope);
            profileState[p] += (target - profileState[p]) * WAVE_STYLE.responseLerp;
            const x = (p / Math.max(1, pointCount - 1)) * width;
            const bar = Math.max(height * 0.12, profileState[p] * maxHalfHeight * WAVE_STYLE.liveBarScale);
            canvasCtx.beginPath();
            canvasCtx.moveTo(x, centerY - bar);
            canvasCtx.lineTo(x, centerY + bar);
            canvasCtx.stroke();
          }
        } else {
          const t = performance.now() * 0.00125;
          const idlePulse = 0.9 + 0.24 * Math.sin(performance.now() * 0.0011);
          for (let p = 0; p < pointCount; p += 1) {
            const xNorm = p / Math.max(1, pointCount - 1);
            const x = xNorm * width;
            const phase = xNorm * 11.7 + t * 1.25;
            const harmonicA = Math.sin(phase);
            const harmonicB = Math.sin(phase * 0.62 + t * 0.55);
            const harmonicC = Math.sin(phase * 1.55 - t * 0.35);
            const smooth = (harmonicA * 0.56) + (harmonicB * 0.29) + (harmonicC * 0.15);
            const envelope = 0.5 + 0.5 * Math.sin(xNorm * Math.PI);
            const undulation = 0.78 + 0.88 * Math.abs(smooth);
            const target = Math.max(0.07, Math.min(1, WAVE_STYLE.idleLevel * undulation * envelope * idlePulse * WAVE_STYLE.idleIntensity));
            profileState[p] += (target - profileState[p]) * 0.24;
            const bar = Math.max(3.2, maxHalfHeight * profileState[p]);
            canvasCtx.beginPath();
            canvasCtx.moveTo(x, centerY - bar);
            canvasCtx.lineTo(x, centerY + bar);
            canvasCtx.stroke();
          }
        }
        waveRafId = requestAnimationFrame(drawWaveBars);
      };
      const startWaveLoop = () => {
        if (!canvasCtx || waveRafId) return;
        waveRafId = requestAnimationFrame(drawWaveBars);
      };
      const playNarration = ({ restart = false } = {}) => {
        if (restart) {
          try { audioEl.currentTime = 0; } catch (_) {}
        }
        const playPromise = audioEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            setWaveState('paused');
          });
        }
      };
      playBtn.addEventListener('click', async () => {
        await ensureAudioAnalyser();
        playNarration();
      });
      pauseBtn.addEventListener('click', () => {
        audioEl.pause();
      });
      restartBtn.addEventListener('click', async () => {
        await ensureAudioAnalyser();
        playNarration({ restart: true });
      });
      audioEl.addEventListener('playing', async () => {
        await ensureAudioAnalyser();
        setWaveState('playing');
        startWaveLoop();
      });
      audioEl.addEventListener('pause', () => {
        if (!audioEl.ended) {
          setWaveState('paused');
        }
      });
      audioEl.addEventListener('ended', () => {
        try { audioEl.currentTime = 0; } catch (_) {}
        setWaveState('paused');
      });
      audioEl.addEventListener('error', () => {
        setWaveState('paused');
      });
      setWaveState('paused');
      startWaveLoop();
      window.addEventListener('resize', ensureWaveCanvasSize, { passive: true });
    })();
  </script>
