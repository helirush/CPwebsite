  <!-- Capture every mic stream before Clerk/Hume scripts load so Mute can hard-kill tracks. -->
  <script>
    (() => {
      const registry = {
        streams: [],
        tracks: [],
        muted: false,
      };
      window.__CP_MIC_REGISTRY = registry;

      const rememberStream = (stream) => {
        if (!stream || typeof stream.getAudioTracks !== 'function') return stream;
        if (!registry.streams.includes(stream)) registry.streams.push(stream);
        try {
          stream.getAudioTracks().forEach((track) => {
            if (!track) return;
            if (!registry.tracks.includes(track)) registry.tracks.push(track);
            // If currently muted, immediately silence any new track.
            if (registry.muted) {
              try { track.enabled = false; } catch (_e) {}
              try { track.stop(); } catch (_e) {}
            }
            try {
              track.addEventListener('ended', () => {
                registry.tracks = registry.tracks.filter((t) => t !== track);
              });
            } catch (_e) {}
          });
        } catch (_e) {}
        return stream;
      };

      const wrapGetUserMedia = (fn) => {
        if (typeof fn !== 'function') return fn;
        return function patchedGetUserMedia(constraints) {
          const result = fn.call(this, constraints);
          if (result && typeof result.then === 'function') {
            return result.then((stream) => rememberStream(stream));
          }
          return rememberStream(result);
        };
      };

      const installOnNavigator = (nav) => {
        if (!nav) return false;
        try {
          if (nav.mediaDevices && typeof nav.mediaDevices.getUserMedia === 'function') {
            if (!nav.mediaDevices.__cpMicPatched) {
              nav.mediaDevices.getUserMedia = wrapGetUserMedia(nav.mediaDevices.getUserMedia.bind(nav.mediaDevices));
              nav.mediaDevices.__cpMicPatched = true;
            }
          }
        } catch (_e) {}
        try {
          if (typeof nav.getUserMedia === 'function' && !nav.__cpLegacyMicPatched) {
            nav.getUserMedia = wrapGetUserMedia(nav.getUserMedia.bind(nav));
            nav.__cpLegacyMicPatched = true;
          }
        } catch (_e) {}
        try {
          if (typeof nav.webkitGetUserMedia === 'function' && !nav.__cpWebkitMicPatched) {
            nav.webkitGetUserMedia = wrapGetUserMedia(nav.webkitGetUserMedia.bind(nav));
            nav.__cpWebkitMicPatched = true;
          }
        } catch (_e) {}
        return true;
      };

      // Parent page first.
      installOnNavigator(navigator);

      // Also patch same-origin iframe navigators after they load.
      window.__CP_INSTALL_MIC_INTERCEPTOR_ON = (win) => {
        try {
          if (!win || !win.navigator) return false;
          return installOnNavigator(win.navigator);
        } catch (_e) {
          return false;
        }
      };

      window.__CP_SET_MIC_MUTED = (muted) => {
        registry.muted = Boolean(muted);
        let changed = 0;
        // Clean dead tracks
        registry.tracks = registry.tracks.filter((t) => t && t.readyState !== 'ended');
        registry.tracks.forEach((track) => {
          try {
            if (registry.muted) {
              track.enabled = false;
              // Hard stop so OS/browser mic capture actually ends.
              track.stop();
            } else {
              track.enabled = true;
            }
            changed += 1;
          } catch (_e) {}
        });
        if (registry.muted) {
          // Drop stopped streams; unmute will request fresh permission/path.
          registry.streams = [];
          registry.tracks = [];
        }
        return changed;
      };
    })();
  </script>

      const roundRectPath = (ctx, x, y, w, h, r) => {
        const radius = Math.max(0, Math.min(r, w / 2, h / 2));

        if (typeof ctx.roundRect === 'function') {
          ctx.roundRect(x, y, w, h, radius);
          return;
        }
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();

      const drawTalkWave = () => {
        if (!talkWaveCtx || !talkWaveCanvas || !talkWave) return;

        const height = talkWave.clientHeight || 36;
        if (!width || !height) {
          waveRafId = window.requestAnimationFrame(drawTalkWave);
          return;

        const centerY = height / 2;
        const maxHalf = (height * WAVE_STYLE.maxBarHeightRatio) / 2;
        talkWaveCtx.clearRect(0, 0, width, height);

        const barCount = WAVE_STYLE.barCount;
        const gap = WAVE_STYLE.barGap;
        const totalGap = gap * (barCount - 1);
        const barWidth = Math.max(3.2, (width - totalGap) / barCount);
        if (waveProfile.length !== barCount) {
          waveProfile = new Array(barCount).fill(WAVE_STYLE.idleLevel);
        }

        const t = performance.now() * 0.00155;
        const live = clerkIsSpeaking && isLive;
        // Traveling wave of block heights across the bar row — stronger sweep/motion.
        const travel = t * (live ? 7.6 : 3.4);
        const pulse = live
          ? 1.18 + 0.42 * Math.sin(performance.now() * 0.02)

        talkWaveCtx.fillStyle = live ? WAVE_STYLE.colorLive : WAVE_STYLE.color;

        for (let i = 0; i < barCount; i += 1) {
          const xNorm = i / Math.max(1, barCount - 1);
          const phase = xNorm * Math.PI * 3.1 - travel;
          const harmonic =
            Math.sin(phase) * 0.5 +
            Math.sin(phase * 0.48 + t * 1.35) * 0.32 +
            Math.sin(phase * 2.05 - t * 0.75) * 0.22 +
            Math.sin(phase * 3.2 + t * 1.1) * 0.12;
          // Soft edge falloff so ends taper like the reference pill.
          const envelope = 0.62 + 0.38 * Math.sin(xNorm * Math.PI);
          const base = live ? WAVE_STYLE.idleLevel * WAVE_STYLE.liveBoost : WAVE_STYLE.idleLevel;
          const intensity = live ? 1.85 : WAVE_STYLE.idleIntensity * 0.95;
          const target = Math.max(
            0.18,
            Math.min(1, base * (0.42 + 1.15 * Math.abs(harmonic)) * envelope * pulse * intensity)
          );

          const half = Math.max(WAVE_STYLE.minBarPx / 2, maxHalf * waveProfile[i]);
          const barH = Math.max(WAVE_STYLE.minBarPx, half * 2);
          const x = i * (barWidth + gap);
          const y = centerY - barH / 2;
          roundRectPath(talkWaveCtx, x, y, barWidth, barH, WAVE_STYLE.barRadius);

      const normalizeRuntimeAuthCandidate = (payload) => {
        if (!payload || typeof payload !== 'object') return null;
        const rawType = String(payload.type || payload.authType || '').trim().toLowerCase();
        let type = '';
        if (
          rawType === 'accesstoken' ||
          rawType === 'access_token' ||
          rawType === 'access-token' ||
          rawType === 'token'
        ) {
          type = 'accessToken';
        } else if (
          rawType === 'apikey' ||
          rawType === 'api_key' ||
          rawType === 'api-key' ||
          rawType === 'key'
        ) {
          type = 'apiKey';
        }
        const value = String(
          payload.value ||
          payload.accessToken ||
          payload.access_token ||
          payload.apiKey ||
          payload.api_key ||
          ''
        ).trim();
        if (!type && payload.accessToken) type = 'accessToken';
        if (!type && (payload.apiKey || payload.api_key)) type = 'apiKey';
        if (!type || !value) return null;
        return { type, value };
      };

      const applyRuntimeAuth = (candidate) => {

        const bag = { type: candidate.type, value: candidate.value };

      const postVoiceMessage = (type, payload) => {

        const msg = payload === undefined ? { type } : { type, payload };
        // Try exact origin first, then wildcard fallback for local preview variants.
        try {
          const origin = frame.src ? new URL(frame.src, window.location.href).origin : '*';
          frame.contentWindow.postMessage(msg, origin || '*');

      const collectAudioTracksFromScope = (root, out) => {
        if (!root || !out) return;
        try {
          // Media elements
          const mediaNodes = root.querySelectorAll ? root.querySelectorAll('audio, video') : [];
          mediaNodes.forEach((node) => {
            try {

            }
          });
          installInterceptorOnFrame();
        };
        const existing = getVoiceFrame();
        if (existing) bindFrame(existing);
        const obs = new MutationObserver(() => {
          const frame = getVoiceFrame();
          if (frame) bindFrame(frame);
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
      };
      watchVoiceFrame();

      setActive(false);
      setBottomWaiting();
    })();
  </script>
</body>
</html>
