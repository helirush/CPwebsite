<body class="home-page">
  <main class="site-wrap">
    <section class="page-card">
      <img class="page-image" src="./assets/CognitionPartner_p1.png?v=20260722-2327" alt="Cognition Partner page 1" />
      <div class="home-brand-overlay" aria-label="Cognition Partner branding">
        <img class="home-brand-logo" src="./assets/CPlogo_60715.png?v=20260715-1844" alt="Cognition Partner logo" />
        <div class="home-brand-wordmark" aria-hidden="true">
          <span class="home-brand-word home-brand-word-white">COGNITION</span>
          <span class="home-brand-word home-brand-word-gold">PARTNER</span>
          <span class="home-brand-tm">™</span>
        </div>
        <div class="home-brand-divider" aria-hidden="true"></div>
        <p class="home-brand-caption">REASON TOGETHER. BUILD TOMORROW.</p>
      </div>
      <div class="page1-audio-controls" aria-label="Meet Unity narration controls">
        <p class="page1-audio-note" id="page1AudioNote">Meet Unity to begin the Cognition Partner introduction.</p>
        <div class="page1-meet-unity" role="group" aria-label="Meet Unity">
          <span class="page1-meet-unity-label">Meet Unity</span>
          <div class="page1-narration-chips">
            <button id="page1AudioOnButton" type="button" class="page1-narration-chip page1-chip-on" aria-label="Turn Unity narration on">ON</button>
            <button id="page1AudioOffButton" type="button" class="page1-narration-chip page1-chip-off" aria-label="Turn Unity narration off and restart">OFF</button>
            <button id="page1AudioPauseButton" type="button" class="page1-narration-chip page1-chip-pause" aria-label="Pause Unity narration">PAUSE</button>
          </div>
        </div>
        <audio id="page1NarrationAudio" preload="metadata" src="./assets/audio/CognitionPartner_page1.mp3">
          Your browser does not support audio playback.
        </audio>
      </div>
      <a class="down-nav-button page1-down-nav-button" href="./page2.html" aria-label="Go to page 2 and amplify your reasoning">
        <span class="page1-down-nav-label">Begin a New Understanding</span>
      </a>
    </section>
  </main>
  <script>
    (() => {
      const audioEl = document.getElementById('page1NarrationAudio');
      const onBtn = document.getElementById('page1AudioOnButton');
      const offBtn = document.getElementById('page1AudioOffButton');
      const pauseBtn = document.getElementById('page1AudioPauseButton');
      const noteEl = document.getElementById('page1AudioNote');

      if (!audioEl || !onBtn || !offBtn || !pauseBtn || !noteEl) return;

      const setNote = (message) => {
        noteEl.textContent = message;
      };

      const setUiState = (state) => {
        // state: idle | playing | paused
        onBtn.classList.toggle('is-active', state === 'playing');
        pauseBtn.classList.toggle('is-active', state === 'paused');
        offBtn.classList.toggle('is-active', state === 'idle');

        onBtn.setAttribute('aria-pressed', state === 'playing' ? 'true' : 'false');
        pauseBtn.setAttribute('aria-pressed', state === 'paused' ? 'true' : 'false');
        offBtn.setAttribute('aria-pressed', state === 'idle' ? 'true' : 'false');
      };

      const playNarration = ({ restart = false } = {}) => {
        if (restart) {
          try { audioEl.currentTime = 0; } catch (_) {}
        }
        const playPromise = audioEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            setUiState('idle');
            setNote('Unity narration needs a click to start. Press ON to begin.');
          });
        }
      };

      const pauseNarration = () => {
        if (audioEl.paused && !audioEl.ended) {
          setUiState(audioEl.currentTime > 0 ? 'paused' : 'idle');
          return;
        }
        audioEl.pause();
        setUiState('paused');
        setNote('Unity is paused. Press ON to continue, or OFF to start over.');
      };

      const stopNarration = ({ reset = true } = {}) => {
        audioEl.pause();
        if (reset) {
          try { audioEl.currentTime = 0; } catch (_) {}
        }
        setUiState('idle');
      };

      onBtn.addEventListener('click', () => {
        // Resume if paused mid-track; restart if ended/idle at start.
        const restart = audioEl.ended || audioEl.currentTime <= 0.05;
        playNarration({ restart });
      });

      pauseBtn.addEventListener('click', () => {
        if (audioEl.paused) {
          if (audioEl.currentTime > 0 && !audioEl.ended) {
            setUiState('paused');
            setNote('Unity is paused. Press ON to continue, or OFF to start over.');
          }
          return;
        }
        pauseNarration();
      });

      offBtn.addEventListener('click', () => {
        stopNarration({ reset: true });
        setNote('Unity narration is off. Press ON when you are ready to Meet Unity.');
      });

      audioEl.addEventListener('playing', () => {
        setUiState('playing');
        setNote('Listening now: Unity introduces Cognition Partner.');
      });

      audioEl.addEventListener('pause', () => {
        if (!audioEl.ended && audioEl.currentTime > 0) {
          setUiState('paused');
        }
      });

      audioEl.addEventListener('ended', () => {
        stopNarration({ reset: true });
        setNote('Narration complete. Press ON to Meet Unity again.');
      });

      audioEl.addEventListener('error', () => {
        stopNarration({ reset: true });
        setNote('Unity narration is temporarily unavailable. Please try ON again shortly.');
      });

      setUiState('idle');
    })();
  </script>
</body>
</html>
