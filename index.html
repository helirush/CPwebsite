  <script>
    (() => {
      const audioEl = document.getElementById('cpR1NarrationAudio');
      const playBtn = document.getElementById('cpR1PlayButton');
      const pauseBtn = document.getElementById('cpR1PauseButton');
      const restartBtn = document.getElementById('cpR1RestartButton');
      const waveEl = document.getElementById('cpR1WhyWave');

      if (!audioEl || !playBtn || !pauseBtn || !restartBtn || !waveEl) return;

      const setWaveState = (state) => {
        waveEl.classList.toggle('is-playing', state === 'playing');
        waveEl.classList.toggle('is-paused', state === 'paused');
      };

      const playNarration = ({ restart = false } = {}) => {
        if (restart) {
          try { audioEl.currentTime = 0; } catch (_) {}
        }
        const playPromise = audioEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            setWaveState('paused');
          });
        }
      };

      playBtn.addEventListener('click', () => {
        playNarration();
      });

      pauseBtn.addEventListener('click', () => {
        audioEl.pause();
      });

      restartBtn.addEventListener('click', () => {
        playNarration({ restart: true });
      });

      audioEl.addEventListener('playing', () => {
        setWaveState('playing');
      });

      audioEl.addEventListener('pause', () => {
        if (!audioEl.ended) {
          setWaveState('paused');
        }
      });

      audioEl.addEventListener('ended', () => {
        try { audioEl.currentTime = 0; } catch (_) {}
        setWaveState('paused');
      });

      audioEl.addEventListener('error', () => {
        setWaveState('paused');
      });

      setWaveState('paused');
    })();
  </script>
